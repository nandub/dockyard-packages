services:
  opensearch:
    image: ${image.repository}:${image.tag}
    restart: ${service.restart}
    environment:
      - cluster.name=${cluster.name}
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${auth.initialAdminPassword}
      - OPENSEARCH_JAVA_OPTS=-Xms${java.heap} -Xmx${java.heap}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: ${ulimits.nofile}
        hard: ${ulimits.nofile}
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${service.bindHost}:${service.httpPort}:9200"
      - "${service.bindHost}:${service.performanceAnalyzerPort}:9600"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -k -u admin:${auth.initialAdminPassword} https://localhost:9200 >/dev/null || exit 1"
      interval: ${healthcheck.interval}
      timeout: ${healthcheck.timeout}
      retries: ${healthcheck.retries}
      start_period: ${healthcheck.startPeriod}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${resources.limits.memory}
        reservations:
          memory: ${resources.reservations.memory}
    networks:
      - opensearch

  opensearch-dashboards:
    image: ${dashboards.image.repository}:${dashboards.image.tag}
    restart: ${dashboards.service.restart}
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
    ports:
      - "${dashboards.service.bindHost}:${dashboards.service.port}:5601"
    expose:
      - "5601"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"
      interval: ${dashboards.healthcheck.interval}
      timeout: ${dashboards.healthcheck.timeout}
      retries: ${dashboards.healthcheck.retries}
      start_period: ${dashboards.healthcheck.startPeriod}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${dashboards.resources.limits.memory}
        reservations:
          memory: ${dashboards.resources.reservations.memory}
    networks:
      - opensearch

volumes:
  opensearch-data:

networks:
  opensearch:
    driver: bridge
