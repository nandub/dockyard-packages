image:
  repository: ghcr.io/open-webui/open-webui
  tag: main

service:
  bindHost: 127.0.0.1
  port: 3000
  restart: unless-stopped

ollama:
  baseUrl: http://host.docker.internal:11434

security:
  webuiSecretKey: Change-OpenWebUI-Secret-4921!River

resources:
  limits:
    memory: 2G
  reservations:
    memory: 512M

healthcheck:
  interval: 30s
  timeout: 10s
  retries: 10
  startPeriod: 60s
