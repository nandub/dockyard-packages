services:
  adminer:
    image: "${image.repository}:${image.tag}"
    environment:
      ADMINER_DEFAULT_SERVER: "${defaultServer}"
    ports:
      - "${service.port}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
