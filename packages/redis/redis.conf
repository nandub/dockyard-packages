# Redis configuration managed by the Dockyard redis package.
# Secrets are injected by the redis-server command line so this file can remain non-sensitive.

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Persistence: combine AOF durability with RDB snapshots.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Logging
loglevel notice

# Reduce blast radius for common destructive/admin commands.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
