services:
  redis:
    image: ${image.repository}:${image.tag}
    restart: ${service.restart}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${auth.password}
      - --maxmemory
      - ${memory.maxmemory}
      - --maxmemory-policy
      - ${memory.policy}
    ports:
      - "${service.bindHost}:${service.port}:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${auth.password}
        - ping
      interval: ${healthcheck.interval}
      timeout: ${healthcheck.timeout}
      retries: ${healthcheck.retries}
      start_period: ${healthcheck.startPeriod}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${resources.limits.memory}
        reservations:
          memory: ${resources.reservations.memory}
    networks:
      - redis

volumes:
  redis-data:

networks:
  redis:
    driver: bridge
