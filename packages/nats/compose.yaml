services:
  nats:
    image: "${image.repository}:${image.tag}"
    command: ["-js", "-m", "8222"]
    volumes:
      - data:/data
    ports:
      - "${service.clientPort}:4222"
      - "${service.monitorPort}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  data:
