services:
  qdrant:
    image: ${image.repository}:${image.tag}
    restart: ${service.restart}
    environment:
      QDRANT__SERVICE__API_KEY: ${security.apiKey}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${security.readOnlyApiKey}
      QDRANT__STORAGE__SNAPSHOTS_PATH: ${storage.snapshotPath}
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    ports:
      - "${service.bindHost}:${service.httpPort}:6333"
      - "${service.bindHost}:${service.grpcPort}:6334"
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -H 'api-key: ${security.apiKey}' http://127.0.0.1:6333/healthz >/dev/null || exit 1"
      interval: ${healthcheck.interval}
      timeout: ${healthcheck.timeout}
      retries: ${healthcheck.retries}
      start_period: ${healthcheck.startPeriod}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${resources.limits.memory}
        reservations:
          memory: ${resources.reservations.memory}
    networks:
      - qdrant

volumes:
  qdrant-storage:
  qdrant-snapshots:

networks:
  qdrant:
    driver: bridge
