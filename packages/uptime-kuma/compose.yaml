services:
  uptime-kuma:
    image: "${image.repository}:${image.tag}"
    volumes:
      - data:/app/data
    ports:
      - "${service.port}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  data:
