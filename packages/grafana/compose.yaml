services:
  grafana:
    image: "${image.repository}:${image.tag}"
    environment:
      GF_SECURITY_ADMIN_USER: "${adminUser}"
      GF_SECURITY_ADMIN_PASSWORD: "${adminPassword}"
      GF_USERS_ALLOW_SIGN_UP: "${allowSignUp}"
      GF_SERVER_ROOT_URL: "${rootUrl}"
    volumes:
      - data:/var/lib/grafana
    ports:
      - "${service.port}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  data:
