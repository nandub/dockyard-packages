services:
  pgadmin:
    image: "${image.repository}:${image.tag}"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${adminEmail}"
      PGADMIN_DEFAULT_PASSWORD: "${adminPassword}"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"
    volumes:
      - data:/var/lib/pgadmin
    ports:
      - "${service.port}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/misc/ping >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  data:
