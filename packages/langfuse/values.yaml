image:
  web:
    repository: langfuse/langfuse
    tag: "3"
  worker:
    repository: langfuse/langfuse-worker
    tag: "3"
network:
  host: 127.0.0.1
service:
  webPort: 3000
  workerPort: 3030
app:
  nextauthUrl: http://localhost:3000
  nextauthSecret: change-langfuse-nextauth-secret
  salt: change-langfuse-salt
  encryptionKey: change-langfuse-encryption-key-32-chars-min
postgres:
  image: postgres:16-alpine
  database: langfuse
  username: langfuse
  password: change-langfuse-postgres-password
redis:
  image: redis:7-alpine
clickhouse:
  image: clickhouse/clickhouse-server:24
  database: langfuse
  username: langfuse
  password: change-langfuse-clickhouse-password
minio:
  image: minio/minio:RELEASE.2025-04-22T22-12-26Z
  rootUser: langfuse
  rootPassword: change-langfuse-minio-password
  bucket: langfuse
