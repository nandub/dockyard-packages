image:
  repository: ollama/ollama
  tag: "0.31.1"

service:
  bindHost: 127.0.0.1
  port: 11434
  restart: unless-stopped

models:
  autoPull: false
  defaultModel: llama3.2

resources:
  limits:
    memory: 8G
  reservations:
    memory: 2G

healthcheck:
  interval: 30s
  timeout: 10s
  retries: 10
  startPeriod: 30s
