services:
  litellm:
    image: ${image.repository}:${image.tag}
    restart: ${service.restart}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    ports:
      - "${service.bindHost}:${service.port}:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${security.masterKey}
      LITELLM_SALT_KEY: ${security.saltKey}
      OLLAMA_API_BASE: ${ollama.apiBase}
      OLLAMA_MODEL: ${ollama.model}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness').read()\" >/dev/null 2>&1 || exit 1"
      interval: ${healthcheck.interval}
      timeout: ${healthcheck.timeout}
      retries: ${healthcheck.retries}
      start_period: ${healthcheck.startPeriod}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${resources.limits.memory}
        reservations:
          memory: ${resources.reservations.memory}
    networks:
      - litellm

networks:
  litellm:
    driver: bridge
