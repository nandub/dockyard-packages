services:
  flowise:
    image: ${image.repository}:${image.tag}
    restart: ${service.restart}
    ports:
      - "${service.bindHost}:${service.port}:3000"
    environment:
      PORT: "3000"
      FLOWISE_USERNAME: ${auth.username}
      FLOWISE_PASSWORD: ${auth.password}
      DATABASE_PATH: ${storage.databasePath}
      LOG_PATH: ${storage.logPath}
      SECRETKEY_PATH: ${storage.secretKeyPath}
      BLOB_STORAGE_PATH: ${storage.blobStoragePath}
    volumes:
      - flowise-data:/root/.flowise
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: ${healthcheck.interval}
      timeout: ${healthcheck.timeout}
      retries: ${healthcheck.retries}
      start_period: ${healthcheck.startPeriod}
    deploy:
      resources:
        limits:
          memory: ${resources.limits.memory}
        reservations:
          memory: ${resources.reservations.memory}
    networks:
      - flowise

volumes:
  flowise-data:

networks:
  flowise:
    driver: bridge
